spring.application.name=medsData

server.port=8088

# MySQL 8
spring.datasource.url=jdbc:mysql://localhost:3306/medsdata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password={MySQLPWD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JSON 时间使用 ISO 字符串（Jackson 3 默认即如此，无需额外配置）
spring.jackson.time-zone=Asia/Shanghai

# 静态资源缓存关闭，方便家庭内更新
spring.web.resources.cache.period=0

# 跨域：默认允许所有来源（前后端同源时无影响）。收紧示例：
# app.cors.allowed-origins=https://your-domain.com,http://192.168.1.10:8080
app.cors.allowed-origins=*

# 单入口门禁：访问 /<entry> 后写入会话 Cookie，携带该 Cookie 才放行；
# 其余请求（含静态页与接口）统一返回 404 空响应且不记日志。
# 环境变量 APP_GATE_ENTRY 填随机串（不带斜杠），留空则关闭门禁。
app.gate.entry=${APP_GATE_ENTRY:}
app.gate.cookie-name=meds_gate
# 空闲有效期（分钟）：每次请求都会续期，超过该时长无操作即失效
app.gate.session-minutes=10

# 代理已转发 X-Forwarded-Proto/Host，交由框架解析，保证 Secure Cookie 与重定向正确
server.forward-headers-strategy=framework

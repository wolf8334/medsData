<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>库存管理</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">家庭用药</span>
    <nav class="nav">
      <a href="/index.html">首页</a>
      <a href="/history.html">历史</a>
      <a href="/plans.html">用药方案</a>
      <a href="/drugs.html">药品</a>
      <a href="/stock.html" class="active">库存</a>
      <a href="/persons.html">用药人</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="card">
    <div class="row"><h2>当前库存</h2><span class="muted">库存与用药方案独立，暂不自动扣库存</span></div>
    <div class="table-scroll">
      <table id="stock-table">
        <thead><tr><th>药品</th><th>规格</th><th>当前库存</th><th>最低库存</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="row">
      <h3>库存流水</h3>
      <div style="min-width:200px"><select id="log-drug"><option value="">全部药品</option></select></div>
    </div>
    <div class="table-scroll">
      <table id="log-table">
        <thead><tr><th>时间</th><th>药品</th><th>类型</th><th>变动</th><th>变动前</th><th>变动后</th><th>备注</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/stock.js"></script>
</body>
</html>
